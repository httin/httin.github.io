---
layout: default
---

<main class="main-content prose">
  <article class="post">
    {% unless page.hide_title %}
    <header class="post-header">
      <h1 class="post-title">{{page.title}}</h1>
      {% if page.feature_image and page.feature_image != "" %}
      <figure class="post-thumbnail image-card width-wide">
        <img src="{{ page.feature_image | relative_url }}" alt="{{ page.title }}">
      </figure><!-- .post-thumbnail -->
      {% endif %}
    </header><!-- .post-header -->
    {% endunless %}
    <div class="post-content{% if page.url == '/about/' %} hub-intro page-about{% endif %}">
      {{content}}
    </div><!-- .post-content -->
  </article><!-- .post -->
</main><!-- .site-main -->
